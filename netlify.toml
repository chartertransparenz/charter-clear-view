[build]
  command = "bun run build && bun tsx scripts/prerender-home.ts && bun tsx scripts/prerender-croatia.ts && bun tsx scripts/prerender-greece.ts && bun tsx scripts/prerender-italy.ts && bun tsx scripts/prerender-france.ts && bun tsx scripts/prerender-spain.ts && bun tsx scripts/prerender-caribbean.ts && bun tsx scripts/prerender-turkey.ts && bun tsx scripts/prerender-partners.ts && bun tsx scripts/generate-sitemap.ts && bun tsx scripts/validate-sitemap.ts && bun tsx scripts/validate-seo.ts"
  publish = "dist"

# Sitemap rewrite: /sitemap.xml → /ct-sitemap.xml (200 rewrite) - HIGHEST PRIORITY
[[redirects]]
  from = "/sitemap.xml"
  to = "/ct-sitemap.xml"
  status = 200
  force = true

# Host canonicalization (www -> non-www) - SECOND PRIORITY
[[redirects]]
  from = "https://www.chartertransparenz.de/*"
  to = "https://chartertransparenz.de/:splat"
  status = 301
  force = true

# Case normalization - SECOND PRIORITY
[[redirects]]
  from = "/Reviere/*"
  to = "/reviere/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/Mittelmeer/*"
  to = "/reviere/mittelmeer/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/Kroatien/*"
  to = "/reviere/mittelmeer/kroatien/:splat"
  status = 301
  force = true

# Legacy slug redirects - THIRD PRIORITY
[[redirects]]
  from = "/reviere/mittelmeer/kroatien/kvarner-bucht"
  to = "/reviere/mittelmeer/kroatien/kvarner"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/kroatien/norddalmatien"
  to = "/reviere/mittelmeer/kroatien/zadar"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/kroatien/mitteldalmatien"
  to = "/reviere/mittelmeer/kroatien/dalmatien-split"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/kroatien/sueddalmatien"
  to = "/reviere/mittelmeer/kroatien/dubrovnik"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/griechenland/ionische-inseln"
  to = "/reviere/mittelmeer/griechenland/ionisches-meer"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/italien/toskana"
  to = "/reviere/mittelmeer/italien/toskana-elba"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/italien/amalfikuste"
  to = "/reviere/mittelmeer/italien/amalfikueste"
  status = 301
  force = true

# Legacy Balearic URLs - FOURTH PRIORITY
[[redirects]]
  from = "/spanien/mallorca"
  to = "/reviere/mittelmeer/spanien/balearen/mallorca"
  status = 301
  force = true

[[redirects]]
  from = "/spanien/ibiza"
  to = "/reviere/mittelmeer/spanien/balearen/ibiza"
  status = 301
  force = true

[[redirects]]
  from = "/spanien/menorca"
  to = "/reviere/mittelmeer/spanien/balearen/menorca"
  status = 301
  force = true

[[redirects]]
  from = "/balearen/mallorca"
  to = "/reviere/mittelmeer/spanien/balearen/mallorca"
  status = 301
  force = true

[[redirects]]
  from = "/balearen/ibiza"
  to = "/reviere/mittelmeer/spanien/balearen/ibiza"
  status = 301
  force = true

[[redirects]]
  from = "/balearen/menorca"
  to = "/reviere/mittelmeer/spanien/balearen/menorca"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/spanien/mallorca"
  to = "/reviere/mittelmeer/spanien/balearen/mallorca"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/spanien/ibiza"
  to = "/reviere/mittelmeer/spanien/balearen/ibiza"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/mittelmeer/spanien/menorca"
  to = "/reviere/mittelmeer/spanien/balearen/menorca"
  status = 301
  force = true

############################################
# CARIBBEAN - CANONICALIZATION & SSG
############################################

# 1) Legacy slugs → canonical URLs (permanent 301)
[[redirects]]
  from = "/reviere/karibik/britische-jungferninseln"
  to = "/reviere/karibik/bvi"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/karibik/us-jungferninseln"
  to = "/reviere/karibik/usvi"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/karibik/us-virgin-islands"
  to = "/reviere/karibik/usvi"
  status = 301
  force = true

# 2) Serve prerendered HTML (200 rewrite, NO force!)
# Hub page first
[[redirects]]
  from = "/reviere/karibik"
  to = "/reviere/karibik/index.html"
  status = 200

# All Caribbean subpages (bvi, usvi, bahamas, antigua, st-martin, st-vincent-grenadinen)
[[redirects]]
  from = "/reviere/karibik/*"
  to = "/reviere/karibik/:splat/index.html"
  status = 200

# Croatia prerendered routes - SERVE STATIC HTML
# Hub page first (before wildcard)
[[redirects]]
  from = "/reviere/mittelmeer/kroatien"
  to = "/reviere/mittelmeer/kroatien/index.html"
  status = 200

# Wildcard for all Croatia subpages (istrien, kvarner, zadar, dalmatien-split, dubrovnik)
[[redirects]]
  from = "/reviere/mittelmeer/kroatien/*"
  to = "/reviere/mittelmeer/kroatien/:splat/index.html"
  status = 200

# Greece prerendered routes - SERVE STATIC HTML
# Hub page first (before wildcard)
[[redirects]]
  from = "/reviere/mittelmeer/griechenland"
  to = "/reviere/mittelmeer/griechenland/index.html"
  status = 200

# Wildcard for all Greece subpages (ionisches-meer, athen-saronischer-golf, kykladen, dodekanes, sporaden)
[[redirects]]
  from = "/reviere/mittelmeer/griechenland/*"
  to = "/reviere/mittelmeer/griechenland/:splat/index.html"
  status = 200

# Italy prerendered routes - SERVE STATIC HTML
# Hub page first (before wildcard)
[[redirects]]
  from = "/reviere/mittelmeer/italien"
  to = "/reviere/mittelmeer/italien/index.html"
  status = 200

# Wildcard for all Italy subpages (sardinien, toskana-elba, amalfikueste, sizilien)
[[redirects]]
  from = "/reviere/mittelmeer/italien/*"
  to = "/reviere/mittelmeer/italien/:splat/index.html"
  status = 200

# France prerendered routes - SERVE STATIC HTML
[[redirects]]
  from = "/reviere/mittelmeer/frankreich"
  to = "/reviere-mittelmeer-frankreich.html"
  status = 200

# Spain/Balearen prerendered routes - SERVE STATIC HTML
[[redirects]]
  from = "/reviere/mittelmeer/spanien"
  to = "/reviere/mittelmeer/spanien/index.html"
  status = 200

[[redirects]]
  from = "/reviere/mittelmeer/spanien/balearen"
  to = "/reviere/mittelmeer/spanien/balearen/index.html"
  status = 200

[[redirects]]
  from = "/reviere/mittelmeer/spanien/balearen/*"
  to = "/reviere/mittelmeer/spanien/balearen/:splat/index.html"
  status = 200

[[redirects]]
  from = "/reviere/mittelmeer/spanien/*"
  to = "/reviere/mittelmeer/spanien/:splat/index.html"
  status = 200

# Canary Islands prerendered routes - SERVE STATIC HTML
[[redirects]]
  from = "/reviere/atlantik/kanaren"
  to = "/reviere/atlantik/kanaren/index.html"
  status = 200

[[redirects]]
  from = "/reviere/atlantik/kanaren/*"
  to = "/reviere/atlantik/kanaren/:splat/index.html"
  status = 200

############################################
# TÜRKEI – Legacy-301 & SSG-200 Rewrites
############################################

# 1) Legacy/alternative Slugs → kanonische (301, force)
[[redirects]]
  from = "/reviere/mittelmeer/türkei"
  to   = "/reviere/mittelmeer/tuerkei"
  status = 301
  force  = true

[[redirects]]
  from = "/reviere/mittelmeer/tuerkei/gocek-fethiye"
  to   = "/reviere/mittelmeer/tuerkei/goecek-fethiye"
  status = 301
  force  = true

[[redirects]]
  from = "/reviere/mittelmeer/tuerkei/goecek"
  to   = "/reviere/mittelmeer/tuerkei/goecek-fethiye"
  status = 301
  force  = true

[[redirects]]
  from = "/reviere/mittelmeer/tuerkei/fethiye"
  to   = "/reviere/mittelmeer/tuerkei/goecek-fethiye"
  status = 301
  force  = true

# 2) SSG-HTML ausliefern (CLEAN-URL → index.html). KEIN force!
[[redirects]]
  from = "/reviere/mittelmeer/tuerkei"
  to   = "/reviere/mittelmeer/tuerkei/index.html"
  status = 200

[[redirects]]
  from = "/reviere/mittelmeer/tuerkei/*"
  to   = "/reviere/mittelmeer/tuerkei/:splat/index.html"
  status = 200

############################################
# PARTNER PAGES – SSG-200 Rewrites
############################################

# Partner hub page
[[redirects]]
  from = "/yachtcharter-partner"
  to = "/yachtcharter-partner/index.html"
  status = 200

# Individual partner pages (16 partners)
[[redirects]]
  from = "/yachtcharter-partner/*"
  to = "/yachtcharter-partner/:splat/index.html"
  status = 200

############################################
# TRAILING SLASH CANONICALIZATION (NO SLASH)
############################################
# Partner pages: Trailing slash → no slash (301)
[[redirects]]
  from = "/yachtcharter-partner/*/"
  to = "/yachtcharter-partner/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/yachtcharter-partner/"
  to = "/yachtcharter-partner"
  status = 301
  force = true

# Wildcard: alle /reviere/*/ → /reviere/* (301)
[[redirects]]
  from = "/reviere/*/"
  to = "/reviere/:splat"
  status = 301
  force = true

# Root /reviere/ → /reviere
[[redirects]]
  from = "/reviere/"
  to = "/reviere"
  status = 301
  force = true

# Additional Case Normalization
[[redirects]]
  from = "/REVIERE/*"
  to = "/reviere/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/reviere/MITTELMEER/*"
  to = "/reviere/mittelmeer/:splat"
  status = 301
  force = true

# Long-term cache for immutable assets (hashed filenames from Vite build)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-term cache for images (1 year — filenames are content-addressable UUIDs)
[[headers]]
  for = "/lovable-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon
[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sitemap & Robots.txt Headers
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    ETag = "auto"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Explicit Sitemap/Robots.txt Serving (before SPA fallback)

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

# SPA fallback - LAST PRIORITY (catch-all for non-prerendered routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Bust 2025-10-13T19:45:00Z
